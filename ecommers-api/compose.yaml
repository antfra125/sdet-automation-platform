
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ecommerce
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ecommerce
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  tests:
    build:
      context: ../sdet-automation-platform
    environment:
      API_BASE_URL: http://api:3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ecommerce
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ecommerce
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    profiles:
      - test

volumes:
  postgres_data:
